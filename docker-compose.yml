services:
  postgres:
    image: postgres:16-alpine
    container_name: essenza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: essenza
      POSTGRES_PASSWORD: essenza_dev
      POSTGRES_DB: essenza
    ports:
      - "5433:5432"
    volumes:
      - essenza_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U essenza -d essenza"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  essenza_postgres:
